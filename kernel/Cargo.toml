[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[lib]
# doctests can't run on this target; keep `cargo test` output clean
doctest = false

[[bin]]
name = "kernel"
bench = false

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false

[dependencies]
bootloader_api = "0.11"
noto-sans-mono-bitmap = "0.3"
x86_64 = "0.15"
uart_16550 = "0.3"
spin = "0.9"
